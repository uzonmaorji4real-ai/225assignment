<!DOCTYPE html>
<html>
<head>
    <title>Student Greeting System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #greeting {
            margin-top: 20px;
            font-size: 20px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Student Greeting System</h2>

        <input type="text" id="studentName" placeholder="Enter Student Name">

        <br>

        <button onclick="greetStudent()">Greet Student</button>

        <div id="greeting"></div>
    </div>

    <script>
        function greetStudent() {
            let name = document.getElementById("studentName").value;

            if (name.trim() === "") {
                document.getElementById("greeting").innerHTML =
                    "Please enter a student's name.";
            } else {
                document.getElementById("greeting").innerHTML =
                    "Hello, " + name + "! Welcome to the class.";
            }
        }
    </script>

</body>
</html>
